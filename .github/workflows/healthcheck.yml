# Daily check that the hosted demo is up until judging ends (Dec 15, 2026). Set the repository secret
# DEMO_URL to the frontend's public URL (e.g. https://checkout-guard-web.onrender.com); /api/healthz is
# proxied to the backend and answers 503 with status "degraded" when the database, PayPal sandbox, Gemini
# or the live stream is down.
name: Demo health

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthz:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/healthz
        env:
          DEMO_URL: ${{ secrets.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "::warning::DEMO_URL secret is not set; nothing to check"
            exit 0
          fi
          # --retry covers a slow first answer after a deploy; no -f, so a 503 body is still printed.
          body=$(curl -sS --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "${DEMO_URL%/}/api/healthz")
          echo "$body"
          status=$(echo "$body" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "::error::demo health is '$status'"
            exit 1
          fi
