[project]
name = "checkout-guard-backend"
version = "0.1.0"
description = "Checkout Guard backend: PayPal checkout attack detection and response"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "paypal-server-sdk>=2.4.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/ai/reporter.py" = ["E501"]  # Markdown templates read better unwrapped
"migrations/*" = ["E501", "I001", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
